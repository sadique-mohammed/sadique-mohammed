<text x="44" y="116" fill="#c9d1d9" font-size="16" font-family="monospace" xml:space="preserve">• Tech: Python, Paramiko, Pydantic, Linux, Bash</text>
<text x="44" y="142" fill="#c9d1d9" font-size="16" font-family="monospace" xml:space="preserve">• Enforced zero arbitrary remote execution by validating SSH commands against a</text>
