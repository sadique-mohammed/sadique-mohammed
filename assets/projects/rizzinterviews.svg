<text x="44" y="36" fill="#f0f6fc" font-size="22" font-family="monospace" font-weight="700">RizzInterviews</text>
<text x="44" y="62" fill="#8b949e" font-size="14" font-family="monospace">Flagship mock interview platform</text>
<text x="44" y="90" fill="#c9d1d9" font-size="16" font-family="monospace" xml:space="preserve">• Tier: Tier 1 · Mar 2026 - Apr 2026</text>
<text x="44" y="116" fill="#c9d1d9" font-size="16" font-family="monospace" xml:space="preserve">• Tech: Next.js, TypeScript, PostgreSQL, Redis, Docker, GenAI APIs</text>
<text x="44" y="142" fill="#c9d1d9" font-size="16" font-family="monospace" xml:space="preserve">• Eliminated async waterfalls and slow SQL queries, reducing latency from 5,000 ms to</text>
<text x="44" y="168" fill="#c9d1d9" font-size="16" font-family="monospace" xml:space="preserve">• 500 ms.</text>
<text x="44" y="194" fill="#c9d1d9" font-size="16" font-family="monospace" xml:space="preserve">• Built an adaptive difficulty engine that prefetches question buffers, cutting API</text>
<text x="44" y="220" fill="#c9d1d9" font-size="16" font-family="monospace" xml:space="preserve">• transition latency by 600ms.</text>
<text x="44" y="246" fill="#c9d1d9" font-size="16" font-family="monospace" xml:space="preserve">• Replaced dynamic imports with static compilation and Dockerised deployment, cutting</text>
<text x="44" y="272" fill="#c9d1d9" font-size="16" font-family="monospace" xml:space="preserve">• serverless cold-start latency by 83% (8.3s to 1.4s).</text>
<text x="44" y="298" fill="#c9d1d9" font-size="16" font-family="monospace" xml:space="preserve">• Repo: https://github.com/sadique-mohammed/rizz-interviews</text>
